<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Titel & Beschreibung nach Bedarf anpassen -->
    <h1>Audiodatei anhören</h1>
    <p>Tippe auf Play, um die Wiedergabe zu starten.</p>

    <!-- Ersetze 'aufnahme.mp3' durch den genauen Dateinamen deiner MP3 -->
    <audio controls preload="metadata">
      <source src="aufnahme.mp3" type="audio/mpeg">
      Dein Browser unterstützt dieses Audioelement leider nicht.
    </audio>
  </main>

</body>
</html>
